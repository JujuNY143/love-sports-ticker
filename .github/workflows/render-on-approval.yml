name: Render approved segments via HeyGen

# Renders ONLY what a human has already moved into content/approved/ (via `npm run review`),
# so HeyGen credits are never spent without manual approval. Triggers on a push that touches
# content/approved/**, plus manual dispatch for re-runs.
on:
  push:
    branches: [main]
    paths:
      - "content/approved/**"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: bench-warmers-render
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Render approved drafts with HeyGen
        env:
          HEYGEN_API_KEY: ${{ secrets.HEYGEN_API_KEY }}
        run: npm run render

      - name: Commit rendered metadata + outbox manifest
        run: |
          git config user.name "bench-warmers-bot"
          git config user.email "actions@users.noreply.github.com"
          git add content/rendered content/outbox/manifest.json
          git diff --cached --quiet || git commit -m "chore: rendered segment(s) [automated]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      # content/rendered/*.mp4 is gitignored (videos are large binaries) — upload them here as an
      # artifact so you can wire in whatever actually feeds your 24/7 encoder (OBS watch-folder,
      # S3/GCS bucket, direct YouTube upload, etc.). Replace this step once that target is decided.
      - name: Upload rendered video files as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: rendered-segments-${{ github.run_id }}
          path: content/rendered/*.mp4
          if-no-files-found: ignore
          retention-days: 7
